<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Piramide & Media Queries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <!-- Rij 1: 1 kolom -->
        <div class="row r1">
            <div class="col">1</div>
        </div>

        <!-- Rij 2: 2 kolommen -->
        <div class="row r2">
            <div class="col">1</div>
            <div class="col">2</div>
        </div>

        <!-- Rij 3: 3 kolommen -->
        <div class="row r3">
            <div class="col">1</div>
            <div class="col">2</div>
            <div class="col">3</div>
        </div>

        <!-- Rij 4: 4 kolommen -->
        <div class="row r4">
            <div class="col">1</div>
            <div class="col">2</div>
            <div class="col">3</div>
            <div class="col">4</div>
        </div>

        <!-- Rij 5: 6 kolommen -->
        <div class="row r6">
            <div class="col">1</div>
            <div class="col">2</div>
            <div class="col">3</div>
            <div class="col">4</div>
            <div class="col">5</div>
            <div class="col">6</div>
        </div>

        <!-- Rij 6: 12 kolommen -->
        <div class="row r12">
            <div class="col">1</div>
            <div class="col">2</div>
            <div class="col">3</div>
            <div class="col">4</div>
            <div class="col">5</div>
            <div class="col">6</div>
            <div class="col">7</div>
            <div class="col">8</div>
            <div class="col">9</div>
            <div class="col">10</div>
            <div class="col">11</div>
            <div class="col">12</div>
        </div>
    </div>

</body>
</html>
